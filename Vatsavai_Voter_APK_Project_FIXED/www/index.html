const tol=n=>n<=3?0:n<=5?1:2;
function lev(a,b,m){const al=a.length,bl=b.length;if(Math.abs(al-bl)>m)return m+1;let p=Array.from({length:bl+1},(_,i)=>i);
for(let i=1;i<=al;i++){const c=[i];let mn=i;for(let j=1;j<=bl;j++){const v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));c.push(v);if(v<mn)mn=v}
 if(mn>m)return m+1;p=c}return p[bl]}
function tokens(q){return q.trim().split(/\s+/).filter(Boolean).map(t=>{
 if(/\d/.test(t))return{num:true,t:t.toUpperCase()};
 let k=keyOf(t).replace(/ /g,'');if(k.length>=4&&k.endsWith('a'))k=k.slice(0,-1);return k?{num:false,k}:null}).filter(Boolean)}
let res=[],shown=0,fuzzy=false;const PAGE=60;
function run(){
 const q=$('q').value,sc=$('scope').value,st=$('st').value,sx=$('sx').value,a1=+$('a1').value||0,a2=+$('a2').value||999;
 const tk=tokens(q);fuzzy=false;
 const base=[];for(let i=0;i<R.length;i++){const r=R[i];
  if(st&&r[8]!=st)continue;if(sx&&r[7]!==sx)continue;const a=+r[6];if(a<a1||a>a2)continue;base.push(i)}
 if(!tk.length){res=base.map(i=>[i,0]);return draw()}
 const test=(i,fz)=>{let sc2=0;for(const t of tk){
   if(t.num){const r=R[i];const dg=/^\d+$/.test(t.t);if((dg?(String(r[0])===t.t||String(r[4])===t.t||String(r[4]).startsWith(t.t+'/')||(t.t.length>=4&&r[5].includes(t.t))):(r[5].includes(t.t)||String(r[4]).toUpperCase().includes(t.t))))sc2+=3;else return -1;continue}
   let best=-1;const chk=(W,K)=>{if(!fz){if(K.includes(t.k))best=Math.max(best,W.some(w=>w.startsWith(t.k))?3:1)}
     else{const m=tol(t.k.length);for(const w of W){if(lev(t.k,w,m)<=m||lev(t.k,w.slice(0,t.k.length),m)<=m){best=Math.max(best,1);break}}}};
   if(sc!=='rel')chk(nW[i],nK[i]);if(sc!=='name'&&best<0)chk(rW[i],rK[i]);
   if(best<0)return -1;sc2+=best}return sc2};
 let out=[];for(const i of base){const s=test(i,false);if(s>=0)out.push([i,s])}
 if(!out.length&&tk.some(t=>!t.num)){fuzzy=true;for(const i of base){const s=test(i,true);if(s>=0)out.push([i,s])}}
 out.sort((a,b)=>b[1]-a[1]||a[0]-b[0]);res=out;draw()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function card(i){const r=R[i],f=r[7]==='స్త్రీ';
 return `<div class="c${f?' f':''}"><div class="n">క్ర.సం.<b>${r[0]}</b></div><div class="b"><div class="nm">${esc(r[1])}</div>
 <div class="rl">${esc(r[2]||'తండ్రి/భర్త')} పేరు: <b>${esc(r[3])}</b></div>
 <div class="ch"><span><b>వార్డు: ${r[8]}</b></span><span>వయస్సు: ${esc(r[6])}</span><span>లింగము: ${esc(r[7])}</span><span>ఇంటి సంఖ్య: ${esc(r[4]||'—')}</span><span class="id">${esc(r[5])}</span></div>
 <div class="ps">పోలింగ్ కేంద్రము ${r[8]} (203798/${r[8]}) – ${esc(ST[r[8]])} · PDF page ${r[9]} · అ.ఓ.జా.వ.సం. ${esc(r[10])}</div></div></div>`}
function draw(more){
 if(!more){shown=0;$('out').innerHTML=''}
 const n=Math.min(res.length,shown+PAGE);$('out').insertAdjacentHTML('beforeend',res.slice(shown,n).map(x=>card(x[0])).join(''));shown=n;
 $('more').hidden=shown>=res.length;
 $('info').textContent=res.length?`${res.length} voter${res.length>1?'s':''} found${fuzzy?' (no exact spelling match – showing similar spellings)':''} · showing ${shown}`:'';
 if(!res.length)$('out').innerHTML='<div class="empty">No voters found. Try a shorter spelling (e.g. “venkat”), or clear the filters.</div>'}
$('st').innerHTML='<option value="">All wards / polling stations (1–14)</option>'+Object.keys(ST).map(k=>`<option value="${k}">Ward ${k} – ${esc(ST[k]).slice(0,40)}…</option>`).join('');
let tm;$('q').addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(run,130)});
['scope','st','sx','a1','a2'].forEach(id=>$(id).addEventListener('input',run));
$('more').onclick=()=>draw(true);
$('clr').onclick=()=>{$('q').value='';$('a1').value=$('a2').value='';$('st').value=$('sx').value='';$('scope').value='name';run();$('q').focus()};
$('csv').onclick=async()=>{
 if(!res.length){alert('No results to download.');return}
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const rows=[['Serial','Name','Relation','Relation name','Age','Gender','House','Voter ID','Ward','Polling station','PDF page']].concat(res.map(([i])=>{const r=R[i];return[r[0],r[1],r[2],r[3],r[6],r[7],r[4],r[5],r[8],'203798/'+r[8],r[9]]}));
 const txt='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),name='vatsavai_voters_results.csv';
 const P=window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()?window.Capacitor.Plugins:null;
 if(P&&P.Filesystem&&P.Share){
  try{
   await P.Filesystem.writeFile({path:name,data:txt,directory:'CACHE',encoding:'utf8'});
   const u=await P.Filesystem.getUri({path:name,directory:'CACHE'});
   await P.Share.share({title:'Voter results',text:res.length+' voters',url:u.uri,dialogTitle:'Save / Share CSV'});
  }catch(e){if(!/cancel/i.test(String(e&&e.message||e)))alert('CSV export failed: '+(e&&e.message||e))}
  return}
 const b=new Blob([txt],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)};
run();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
